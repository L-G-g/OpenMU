; Mapa del comando M (warpmap.dll). Va junto a camera3d.dll.
;
; [Map] Image: imagen del mapa (PNG o JPG), junto a la DLL.
; [Zones] una zona por warp: número del warp (el índice de Movereq.bmd, el mismo que manda el cliente al
;   servidor) = x1,y1,x2,y2 (rectángulo: esquina de arriba a la izquierda y de abajo a la derecha) o
;   x1,y1,x2,y2,x3,y3,... (polígono de tres puntos o más que se vea entero desde su primer punto, por
;   ejemplo uno convexo), en píxeles de la imagen.
;   Los warps sin zona aparecen como botones al costado de la imagen.
; [Names] nombre a mostrar por número de warp (si no está, el del juego).
; [Text] textos del cartel que aparece con el mouse encima.

